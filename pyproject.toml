[project]
name = "romae-lc"
version = "0.2.0"
description = "RoMAE for light curves: continuous rotary transformers (axial and nD-RoPE, linear attention) with LeJEPA, LeWorldModel and masked-autoencoding pretraining."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hibb-bb" }]
dependencies = ["torch>=2.4", "numpy>=1.24"]

[project.optional-dependencies]
hf = ["datasets>=2.20"]
plot = ["matplotlib>=3.7"]
track = [
    "wandb>=0.17",
]
quant = ["torchao>=0.18"]
bench = ["scikit-learn>=1.5", "pandas>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "black>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["romae_lc"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
